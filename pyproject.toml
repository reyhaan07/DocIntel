[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Relationship-aware document understanding for patient intake forms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pypdfium2>=4.0",
  "reportlab>=4.0",
  "pillow>=10.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.setuptools.package-data]
docintel = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
